name: lint
on: push

jobs:
  update:
    runs-on: ubuntu-26.04
    name: Node 24

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
